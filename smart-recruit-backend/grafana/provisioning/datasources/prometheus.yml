apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    # For local development (both running locally)
    # For Docker: http://prometheus:9090 (service name)
    # For Grafana in Docker and Prometheus locally: http://host.docker.internal:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: "POST"

