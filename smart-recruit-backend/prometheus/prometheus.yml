global:
  scrape_interval: 15s # How frequently to scrape targets
  evaluation_interval: 15s # How frequently to evaluate rules
  external_labels:
    cluster: 'smart-recruit'
    environment: 'development'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']

# Load rules once and periodically evaluate them (optional)
# rule_files:
#   - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Scrape the Smart Recruit backend application
  - job_name: 'smart-recruit-backend'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:5000'] # For local development
        # For Docker: 'backend:5000' (service name)
        # For Prometheus in Docker and app locally: 'host.docker.internal:5000'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'smart-recruit-backend'

  # Optional: Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

