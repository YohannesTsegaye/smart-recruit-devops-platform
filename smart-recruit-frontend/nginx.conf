server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes need to serve the React entry point on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
