---
- name: Install Docker and base dependencies
  hosts: all
  become: true
  tasks:
    - name: Ensure packages are present
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - jq
          - git
          - ufw
        state: present
        update_cache: true

    - name: Add Docker APT GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: 'deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable'
        state: present

    - name: Install Docker engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add ansible user to docker group
      user:
        name: "{{ ansible_user }}"
        append: true
        groups: docker

    - name: Open required ports
      ufw:
        rule: allow
        port: '{{ item }}'
        proto: tcp
      loop:
        - '80'
        - '443'
        - '2377'
        - '7946'
        - '4789'
